---
name: Container Release (Proxmox Backup Server)

'on':
  push:
    branches:
      - main
  schedule:
    # At 12:00 on Sunday.
    - cron: "0 12 * * 0"

jobs:
  build-test:
    name: Container Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build .

  build-release:
    name: Container Release
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          load: true
          tags: dudecalledbro/proxmox-backup-server:build

      - name: Determine Proxmox Backup Server version
        id: version
        run: |
          version=$(docker run --rm dudecalledbro/proxmox-backup-server:build \
            dpkg-query -f='${Version}' -W proxmox-backup-server | tr ':' '_')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        run: |
          docker tag dudecalledbro/proxmox-backup-server:build \
            dudecalledbro/proxmox-backup-server:latest
          docker tag dudecalledbro/proxmox-backup-server:build \
            dudecalledbro/proxmox-backup-server:${{ steps.version.outputs.version }}
          docker push dudecalledbro/proxmox-backup-server:latest
          docker push dudecalledbro/proxmox-backup-server:${{ steps.version.outputs.version }}
